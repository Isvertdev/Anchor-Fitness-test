
name: Build Anchor Fitness APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE"

      - name: Build APK
        working-directory: AnchorFitness
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Anchor-Fitness-APK
          path: AnchorFitness/app/build/outputs/apk/debug/app-debug.apk
          
